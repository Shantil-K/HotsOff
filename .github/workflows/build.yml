name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check shell scripts
        run: |
          for f in tools/*.sh tools/lib/*.sh development/*.sh; do sh -n "$f"; done

      - name: Test user script
        run: node tests/userScript.test.js

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(node -p "require('./appinfo.json').version")
          if [ "v$app_version" != "${GITHUB_REF_NAME}" ]; then
            echo "appinfo.json version ($app_version) does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli@3.2.6

      - name: Build IPK
        run: |
          mkdir -p dist
          sh development/createPackage.sh "$PWD/dist"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: hotsoff-ipk
          path: dist/*.ipk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          generate_release_notes: true
